<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1f22"/>
      <stop offset="55%" stop-color="#0d0e10"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="74%" cy="26%" r="62%">
      <stop offset="0%" stop-color="#1f3a2c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1f3a2c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGreen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c8f52"/>
      <stop offset="100%" stop-color="#30d158"/>
    </linearGradient>
    <linearGradient id="lineBlue" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a7ea6"/>
      <stop offset="100%" stop-color="#64d2ff"/>
    </linearGradient>
    <linearGradient id="lineAmber" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#b5732c"/>
      <stop offset="100%" stop-color="#ffb454"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>
    <linearGradient id="glassStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="lineGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Full-bleed background. Intentionally not corner-rounded: iOS/Android
       apply their own mask shape on top, so pre-rounding here would
       double-clip the corners under a maskable icon context. -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#bgGlow)"/>

  <!-- Glassmorphic panel. Kept inside the ~80% maskable safe zone
       (a centered circle of radius ~205px on a 512 canvas) so nothing
       meaningful gets cropped when Android applies its own icon mask. -->
  <rect x="112" y="112" width="288" height="288" rx="60"
        fill="url(#glassFill)" stroke="url(#glassStroke)" stroke-width="1.5"/>

  <!-- Ambient glow behind the convergence point -->
  <circle cx="346" cy="196" r="74" fill="#30d158" opacity="0.22" filter="url(#softGlow)"/>

  <!-- Three lanes racing toward a single point: three models, one decision -->
  <g fill="none" stroke-linecap="round" filter="url(#lineGlow)">
    <path d="M166 316 C 236 316, 278 274, 346 200" stroke="url(#lineAmber)" stroke-width="9" opacity="0.9"/>
    <path d="M166 276 C 236 276, 288 240, 346 197" stroke="url(#lineBlue)" stroke-width="9" opacity="0.95"/>
    <path d="M166 236 C 236 236, 296 210, 346 194" stroke="url(#lineGreen)" stroke-width="10"/>
  </g>

  <!-- Starting nodes -->
  <circle cx="166" cy="316" r="6.5" fill="#ffb454"/>
  <circle cx="166" cy="276" r="6.5" fill="#64d2ff"/>
  <circle cx="166" cy="236" r="6.5" fill="#30d158"/>

  <!-- Convergence / decision point -->
  <circle cx="346" cy="196" r="13" fill="#eafff2"/>
  <circle cx="346" cy="196" r="13" fill="none" stroke="#30d158" stroke-width="3" opacity="0.9"/>
</svg>
